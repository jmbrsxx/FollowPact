[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,BREVO_REPLY_TO_EMAIL,BREVO_SENDER_NAME,BREVO_SENDER_EMAIL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
